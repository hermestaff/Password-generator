<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name ="viewport" content="width=device-width, intial-scale=1.0">
        <title>Password Generator</title>
        <link rel="stylesheet" href="style.css">
        <style>
            .theme-switch-wrapper {
                display: flex;
                align-items: center;
            }

            .theme-switch-wrapper em{
                margin-left: 10px;
                font-size: 1rem;
            }

            .theme-switch {
                display: inline-block;
                height: 34px;
                position: relative;
                width: 60px;
            }

            .theme-switch input {
                display: none;
            }

            .slider {
                background-color: var(--togglebg);
                bottom: 0;
                cursor: pointer;
                left: 0;
                position: absolute;
                right: 0;
                top: 0;
                transition: 0.4s;
            }

            .slider:before {
                background-color: var(--roundcolor);
                bottom: 4px;
                content: "";
                height: 26px;
                left: 4px;
                position: absolute;
                transition: 0.4s;
                width: 26px;
            }

            input:checked + .slider {
                background-color: var(--toggleslider);
            }

            input:checked + .slider:before{
                transform: translateX(26px);
            }

            .slider.round {
                border-radius: 34px;
            }

            .slider.round:before {
                border-radius: 50%;
            }

            em {
                color: var(--togglesliderColor)
            }
        </style>
        <script>
            const toggleSwitch = document.querySelector(
                '.theme-switch input[type="checkbox"]'
            );

            const currentTheme = localStorage.getItem("theme");

            if (currentTheme){
                document.documentElement.setAttribute("data-theme", currentTheme);

                if (currentTheme === "dark"){
                    toggleSwitch.checked = true;
                }
            }

            function switchTheme(e){
                if (e.target.checked){
                    document.documentElement.setAttribute("data-theme", "dark");

                    localStorage.setItem("theme", "dark");
                } else {
                    document.documentElement.setAttribute("data-theme", "light");
                    localStorage.setItem("theme", "light");
                }
            }

            toggleSwitch.addEventListener("change", switchTheme, false);
        </script>
        <script src="script.js"></script>
        <script src="https://kit.fontawesome.com/4249ae3686.js" crossorigin="anonymous"></script>
    </head>
<body>
    <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox">
            <div class="slider round"></div>
        </label>
        <em>Switch Theme</em>
    </div>

    <div class="container">
        <h2>Password Generator</h2>
        <div class="result-container">
            <textarea id="result" readonly></textarea>
        </div>
        <div class="settings">
            <div clas="setting">
                <label>Password Length</label>
                <input type="number" id="length" min="4" max="20" value="8">
            </div>
            <div class="setting">
                <label>Include uppercase letters</label>
                <input type="checkbox" id="uppercase" checked>
            </div>
            <div class="setting">
                <label>Include lowercase letters</label>
                <input type="checkbox" id="lowercase" checked>
            </div>
            <div class="setting">
                <label>Include numbers</label>
                <input type="checkbox" id="numbers" checked>
            </div>
            <div class="setting">
                <label>Include symbols</label>
                <input type="checkbox" id="symbols" checked>
            </div>
        </div>
        <div class="buttons">
            <button class="btn btn-large" id="generate">
                <i class="fa-solid fa-arrows-rotate"></i>
                Generate Password
            </button>
            
            <button class="btn" id="copy">
                <i class="fa-regular fa-copy"></i>Copy to Clipboard
            </button>
        </div>
    </div>
</body>
